{{define "topbar"}}
<header class="topbar">
  <a class="logo" href="/" aria-label="HostGlance home">
    <svg class="logo-svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <rect x="2" y="2"  width="20" height="6" rx="1.5"/>
      <rect x="2" y="10" width="20" height="6" rx="1.5"/>
      <rect x="2" y="18" width="20" height="4" rx="1.5"/>
      <circle cx="5.5" cy="5"  r="0.9" fill="currentColor" stroke="none"/>
      <circle cx="5.5" cy="13" r="0.9" fill="currentColor" stroke="none"/>
      <circle cx="5.5" cy="20" r="0.9" fill="currentColor" stroke="none"/>
    </svg>
    <span class="logo-name">HostGlance</span>
  </a>

  <nav class="nav-tabs" aria-label="Primary">
    <a class="nav-tab{{if eq .ActiveTab "system"}} active{{end}}" href="/"{{if eq .ActiveTab "system"}} aria-current="page"{{end}}>System</a>
    {{if .StorageEnabled}}<a class="nav-tab{{if eq .ActiveTab "storage"}} active{{end}}" href="/storage"{{if eq .ActiveTab "storage"}} aria-current="page"{{end}}>Storage</a>{{end}}
    {{if .HistoryEnabled}}<a class="nav-tab{{if eq .ActiveTab "history"}} active{{end}}" href="/history"{{if eq .ActiveTab "history"}} aria-current="page"{{end}}>History</a>{{end}}
  </nav>

  <div class="topbar-spacer"></div>

  <div class="topbar-meta">
    <span class="live-dot" id="live-dot" aria-hidden="true"></span>
    <span id="ts"></span>
    <span class="topbar-sep" aria-hidden="true">&middot;</span>
    <span class="topbar-refresh">&#8635;&thinsp;{{.RefreshSecs}}s</span>
  </div>

  {{block "topbar-extra" .}}{{end}}

  <button class="icon-btn" data-theme-toggle aria-label="Toggle light/dark mode"></button>
</header>
{{end}}
