{{define "base"}}<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<script>
/* Skip entrance animations when returning to a page (refresh reloads save UI state). */
try { if (sessionStorage.getItem('hostglance:ui:' + location.pathname)) document.documentElement.classList.add('no-anim'); } catch (_) {}
</script>
<title>{{block "title" .}}HostGlance{{end}}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='26' height='10' rx='3' fill='%234f8ef7'/%3E%3Crect x='3' y='18' width='26' height='10' rx='3' fill='%232563b0'/%3E%3Ccircle cx='9' cy='9' r='2' fill='white'/%3E%3Ccircle cx='9' cy='23' r='2' fill='white'/%3E%3C/svg%3E">
<style>
{{template "tokens"}}
</style>
{{block "styles" .}}{{end}}
</head>
<body{{block "body-attrs" .}}{{end}}>
{{template "topbar" .}}
{{block "content" .}}{{end}}
{{template "shared_js" .}}
{{block "scripts" .}}{{end}}
</body>
</html>{{end}}
